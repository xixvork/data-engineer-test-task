x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

    _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary requests"

    OPENEXCHANGE_APP_ID: ${OPENEXCHANGE_APP_ID:-}

    POSTGRES_1_HOST: postgres-1
    POSTGRES_1_PORT: 5432
    POSTGRES_1_DB: ${POSTGRES_1_DB:-orders_source}
    POSTGRES_1_USER: ${POSTGRES_1_USER:-postgres}
    POSTGRES_1_PASSWORD: ${POSTGRES_1_PASSWORD:-postgres}

    POSTGRES_2_HOST: postgres-2
    POSTGRES_2_PORT: 5432
    POSTGRES_2_DB: ${POSTGRES_2_DB:-orders_target}
    POSTGRES_2_USER: ${POSTGRES_2_USER:-postgres}
    POSTGRES_2_PASSWORD: ${POSTGRES_2_PASSWORD:-postgres}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  postgres-airflow:
    image: postgres:15
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres-1:
    image: postgres:15
    container_name: postgres-1
    environment:
      POSTGRES_USER: ${POSTGRES_1_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_1_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_1_DB:-orders_source}
    ports:
      - "5433:5432"
    volumes:
      - postgres-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_1_USER:-postgres}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres-2:
    image: postgres:15
    container_name: postgres-2
    environment:
      POSTGRES_USER: ${POSTGRES_2_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_2_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_2_DB:-orders_target}
    ports:
      - "5434:5432"
    volumes:
      - postgres-2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_2_USER:-postgres}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email airflow@example.com \
          --password airflow || true

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-airflow-data:
  postgres-1-data:
  postgres-2-data: